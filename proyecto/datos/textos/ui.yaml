# Salverna · Cadenas de interfaz (v1)
#
# Todas las cadenas visibles de la interfaz. Ninguna se escribe en el código.
# El motor las pide con ui("grupo.clave"), p. ej. ui("hoja.boton.carta").
# Cada hoja del árbol es { es: "...", en: "..." }. El español es la versión maestra;
# el inglés adapta la intención. Registro: la casamentera es «usted», en femenino.
#
# Los nombres de lugares (lugares.yaml), personas y casas (personajes.yaml),
# los títulos de evento y los textos de semana (semanas/) NO viven aquí.
#
# ── Variables ─────────────────────────────────────────────────────────────
# De ESQUEMA §1.2:
#   {a} {b}        Nombre de pila de dos personas (pareja de un vínculo, etc.)
#   {dia}          Número del día (27, 4…)
#   {lugar}        Nombre del lugar (de lugares.yaml)
#   {rep}          Cambio de reputación con signo («+2», «−1»)
# Nuevas en este archivo:
#   {n}            Número genérico (semana, contador, ranura, huecos…)
#   {total}        Total de referencia de un contador («2 de {total}»)
#   {min} {max}    Plazas mínimas y máximas de un evento
#   {inicio} {fin} Día de inicio y de fin de un evento de varios días (número)
#   {nombre}       Nombre de pila de la persona a la que se refiere el elemento
#   {nombre|m|f}   Concordancia de género sobre {nombre} (ESQUEMA §1.3)
#   {evento}       Título corto del evento (de semanas/)
#   {tipo}         Nombre del tipo de evento (ui("hoja.tipo.<id>"))
#   {anfitrion}    Anfitrión del evento (campo anfitrion del evento)
#   {habilidad}    Nombre de una habilidad (ui("habilidades.<id>.nombre"))
#   {valor}        Valor de una habilidad, de 0 a 5
#   {baile} {estatus} {chisme} {presencia} {intelecto}
#                  Valores de cada habilidad (lectores de pantalla)
#   {pide} {llevan} Resumen de requisito / del grupo, ya compuesto (lector de pantalla)
#   {dia_semana}   Nombre largo del día (ui("barra_semana.dias.<id>.largo"))
#   {mes}          Nombre del mes (ui("barra_semana.meses.<id>"))
#   {fecha}        Fecha ya compuesta con barra_semana.formato_fecha
#   {semana}       Número de semana (1–6)
#   {fase}         Nombre de fase (ui("ajustes.ranuras.fase.<id>"))
#   {estado}       Texto de estado ya resuelto (lector de pantalla)
#   {expresion}    Expresión ya resuelta (ui("cierre.privado.animo.<id>"))
#   {desenlace}    Etiqueta de sello ya resuelta (ui("resultado.sello.<id>"))
#   {motivo}       Motivo público de un cambio de reputación (de semanas/)
#   {entrada}      Título de una entrada de ficha ya resuelto (ui("ficha.entrada.<id>"))
#   {accion}       Nombre de la acción que confirma un sello (lector de pantalla)
#   {edad}         Edad de la persona
#   {version}      Versión del juego
#   {porcentaje}   Volumen u otro porcentaje (0–100)
# ──────────────────────────────────────────────────────────────────────────

