<title>Salverna · Maqueta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Maqueta de una sola pantalla: el mapa es la pantalla; barra arriba, mano de retratos abajo, hojas que suben. */
:root{
  --marfil:#FBF7F0; --marfil-sombra:#EFE7DA; --tinta:#2B3350; --tinta-suave:#5D6480;
  --seda:#A9C6E0; --seda-hondo:#5E82A8; --rosa:#C0627A; --glicinia:#B9A6D3; --menta:#BFD8C6;
  --oro:#C9A45C; --oro-claro:#E6CF97; --oro-hondo:#8E6E2E; --frambuesa:#B23A5B;
  --fondo:#E9E4EE;
  --display:"Cormorant Garamond", "Cormorant", Georgia, serif;
  --texto:"EB Garamond", Garamond, Georgia, serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);font-variant-numeric:lining-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:center;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seda-hondo);outline-offset:2px}

.telefono{position:relative;width:100%;max-width:390px;height:min(844px,100%);min-height:640px;border-radius:28px;overflow:hidden;
  box-shadow:0 0 0 8px #1f2236,0 24px 60px rgba(30,30,60,.35);background:#cfe0c8}
@media (max-width:440px){ body{padding:0} .telefono{max-width:none;border-radius:0;box-shadow:none;height:100%;min-height:0} }

/* Mapa provisional pintado con gradientes: río, parques y calles */
.mapa{position:absolute;inset:0;
  background:
   radial-gradient(ellipse 60% 18% at 70% 30%, #b9d3a9 60%, transparent 61%),
   radial-gradient(ellipse 35% 14% at 25% 62%, #bcd5ad 60%, transparent 61%),
   linear-gradient(118deg, transparent 38%, #9ec3d9 38.5%, #b6d4e6 43%, #9ec3d9 47%, transparent 47.5%),
   repeating-linear-gradient(28deg, rgba(255,255,255,.35) 0 2px, transparent 2px 46px),
   repeating-linear-gradient(-62deg, rgba(255,255,255,.28) 0 2px, transparent 2px 52px),
   linear-gradient(#e9e1cf,#e4dccb)}
.mapa::after{content:"Mapa de Valcenda (provisional)";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-4deg);
  font-family:var(--display);font-style:italic;font-size:20px;color:rgba(43,51,80,.25);white-space:nowrap}
.sombra-sup{position:absolute;inset:0 0 auto 0;height:120px;background:linear-gradient(rgba(43,51,80,.35),transparent)}
.sombra-inf{position:absolute;inset:auto 0 0 0;height:260px;background:linear-gradient(transparent,rgba(43,51,80,.45))}

/* Barra superior */
.barra{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.semana-txt{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--marfil);text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.4);margin:0 0 4px;text-align:center}
.calendario{display:flex;flex-direction:column}
.ficha-barra{height:42px;background:#FCF8EF;border:1px solid var(--tinta);outline:.5px solid var(--tinta);outline-offset:-4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;line-height:1;position:relative}
.ficha-barra small{font-size:7.5px;letter-spacing:.08em;font-weight:600;margin-bottom:5px}
.semana{width:52px;font-size:16px}
.sobres{position:relative;flex:none;width:42px;height:42px;border:none;cursor:pointer;padding:0;background:none;display:grid;place-items:center}
.sobres svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.sobres span{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-family:var(--display);font-weight:700;font-size:13px;color:var(--tinta);font-variant-numeric:tabular-nums}
.sobres.completo span{color:var(--oro-hondo)}
.dias{display:flex;gap:3px}
.dia{width:33px;font-size:17px}
.dia.libre{opacity:.75}
.dia.sigue{border-color:var(--rosa);outline:1px dashed var(--rosa);outline-offset:-4px;color:var(--rosa)}
.dia.evento{border-color:var(--rosa);outline-color:var(--rosa);color:var(--rosa)}
.dia.hoy{box-shadow:0 0 0 2px var(--oro)}

.sello{width:42px;height:42px;flex:none;border-radius:50%;background:var(--rosa);border:none;box-shadow:inset 0 0 0 3px var(--oro-claro);color:var(--marfil);font-size:15px;cursor:pointer;opacity:.4}
.sello.listo{opacity:1;animation:late 2s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.05)}}

/* Marcadores */
.marcador{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;transform:translate(-50%,-50%)}
.marcador .icono{width:40px;height:40px;border-radius:50%;background:var(--marfil);border:2px solid var(--glicinia);display:grid;place-items:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.marcador.oblig .icono{border-color:var(--rosa)}
.marcador.resp-ok .icono{background:var(--rosa);color:var(--marfil)}
.marcador .etq{display:flex;align-items:stretch;background:var(--marfil);border:1px solid var(--tinta);font-size:13px}
.marcador .etq b{font-family:var(--display);font-size:15px;padding:0 6px;border-right:1px solid var(--tinta);display:grid;place-items:center}
.marcador .etq span{padding:2px 6px;white-space:nowrap}

/* Nota de la asistente */
.nota{position:absolute;left:24px;right:24px;bottom:214px;background:var(--marfil);border:1px solid var(--oro);padding:10px 14px;font-style:italic;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.nota small{display:block;font-style:normal;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--tinta-suave)}

/* Mano de retratos: cuadros rectangulares con marco */
.mano{position:absolute;z-index:6;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;overflow-x:auto;padding:16px 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.mano::-webkit-scrollbar{display:none}
.cuadro{flex:0 0 112px;scroll-snap-align:start;background:none;border:none;padding:0;cursor:pointer;transition:transform .2s}
.cuadro .marco{position:relative;width:112px;height:168px;padding:8px;
  background:
   radial-gradient(circle at 8px 8px,var(--oro-claro) 3px,transparent 3.5px),
   radial-gradient(circle at calc(100% - 8px) 8px,var(--oro-claro) 3px,transparent 3.5px),
   radial-gradient(circle at 8px calc(100% - 8px),var(--oro-claro) 3px,transparent 3.5px),
   radial-gradient(circle at calc(100% - 8px) calc(100% - 8px),var(--oro-claro) 3px,transparent 3.5px),
   linear-gradient(135deg,var(--oro-claro),var(--oro) 35%,var(--oro-hondo) 70%,var(--oro));
  box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.45), inset 0 0 0 3px var(--oro-hondo), inset 0 0 0 4px var(--oro-claro)}
.cuadro .lienzo{position:relative;width:100%;height:100%;overflow:hidden;background:#D6E3EF}
.cuadro .lienzo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--oro-hondo), inset 0 0 0 3px var(--oro-claro), inset 0 0 6px rgba(60,40,10,.35);pointer-events:none;z-index:2}
.cuadro .placa{z-index:3}
.cuadro img{width:100%;height:100%;object-fit:cover;display:block;transform:translateY(7%)}
.cuadro .placa{position:absolute;left:0;right:0;bottom:0;margin:0;background:linear-gradient(var(--oro-claro),var(--oro));border:1px solid var(--oro-hondo);
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-align:center;color:var(--tinta);padding:1px 0}
.cuadro.elegido{transform:translateY(-10px)}
.cuadro.ocupado img{filter:grayscale(1) brightness(.9)}
.cuadro.sacude{animation:sac .35s}
@keyframes sac{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Hojas: suben desde detrás de la mano de retratos. Dos alturas: compacta (asignar) y expandida (detalle). */
.mundo{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.velo{position:absolute;inset:0;z-index:4;background:rgba(30,30,50,.18);opacity:0;pointer-events:none;transition:opacity .3s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{--mano:206px;position:absolute;z-index:5;left:10px;right:10px;bottom:0;
  max-height:calc(100% - 80px);overflow:hidden;padding-bottom:calc(var(--mano) + 10px)!important;background:var(--marfil);border:1px solid var(--oro);border-bottom:none;border-radius:10px 10px 0 0;
  padding:4px 16px 14px;box-shadow:0 -10px 28px rgba(30,30,60,.28);transform:translateY(100%);
  transition:transform .38s cubic-bezier(.2,.8,.2,1), max-height .35s ease;touch-action:none}
.hoja.on{transform:translateY(0)}
.hoja.expandida{overflow-y:auto;touch-action:pan-y}
.hoja .asa{display:block;width:100%;height:22px;border:none;background:none;cursor:grab;position:relative}
.hoja .asa::before{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;border-radius:2px;background:var(--marfil-sombra);transform:translateX(-50%);box-shadow:inset 0 0 0 1px rgba(142,110,46,.35)}
.detalle{display:block}
.carta-completa{display:none}
.hoja.expandida .carta-completa{display:block}
.mas{background:none;border:none;color:var(--seda-hondo);font-size:14px;cursor:pointer;padding:6px 0}
.hoja.expandida .mas .t1, .hoja:not(.expandida) .mas .t2{display:none}
.marcador.activo .icono{box-shadow:0 0 0 4px rgba(192,98,122,.35),0 2px 6px rgba(0,0,0,.2);animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 9px rgba(192,98,122,.12),0 2px 6px rgba(0,0,0,.2)}}
.cuadro.noapto{filter:saturate(.25) brightness(.92);opacity:.7}
.cuadro.elegido .marco{box-shadow:0 0 0 2px var(--rosa),0 8px 16px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.45), inset 0 0 0 3px var(--oro-hondo), inset 0 0 0 4px var(--oro-claro)}
.volando{position:absolute;z-index:20;pointer-events:none;object-fit:cover;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cerrar{position:absolute;top:6px;right:6px;width:40px;height:40px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--tinta-suave)}
.cab{display:flex;gap:12px;align-items:center;padding-right:30px}
.fecha-g{width:48px;height:56px;flex:none;background:#FCF8EF;border:1px solid var(--tinta);outline:.5px solid var(--tinta);outline-offset:-4px;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:24px;position:relative}
.fecha-g small{position:absolute;top:4px;font-size:8px;letter-spacing:.1em}
h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.05;margin:0;text-wrap:balance}
.sub{font-size:13px;color:var(--tinta-suave)}
.cita{font-style:italic;margin:10px 0;font-size:15.5px}
.fila{display:flex;gap:12px;align-items:flex-start}
.plazas{display:flex;gap:8px;flex-wrap:wrap}
.plaza{width:72px;height:108px;border:1.5px dashed var(--oro);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tinta-suave);font-size:12px;background:var(--marfil-sombra);padding:5px;text-align:center;line-height:1.2;cursor:pointer}
.plaza b{font-size:24px;font-weight:400;line-height:1}
.plaza.llena{border:none;padding:5px;background:linear-gradient(135deg,var(--oro-claro),var(--oro) 40%,var(--oro-hondo))}
.plaza.llena img{width:100%;height:100%;object-fit:cover;display:block}
.radar{flex:none}
.lista{margin:10px 0 0;padding:0;list-style:none;font-size:14px;display:grid;gap:3px}
.pie{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.enlace{background:none;border:none;text-decoration:underline;color:var(--seda-hondo);cursor:pointer;font-size:15px}
.sello-g{width:56px;height:56px;border-radius:50%;border:none;background:var(--rosa);box-shadow:inset 0 0 0 4px var(--oro-claro);color:var(--marfil);font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer;opacity:.4}
.sello-g.listo{opacity:1}
.aviso{font-size:13px;color:var(--frambuesa);min-height:18px;margin-top:6px}
.etiqueta{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--tinta-suave);text-transform:uppercase;margin:14px 0 4px}
.ficha-cab{display:flex;gap:14px;align-items:flex-end}
.ficha-cab .cuadro{pointer-events:none}
.bio{font-size:15.5px;line-height:1.45;margin:6px 0 0}
.tecnica{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.tecnica dt{color:var(--tinta-suave)}
.tecnica dd{margin:0}
.entrada{border-top:1px solid var(--marfil-sombra);padding:6px 0;font-size:14.5px}
.entrada.bloq{color:var(--tinta-suave);font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="telefono" id="tel">
  <div class="mundo" id="mundo"><div class="mapa" aria-hidden="true"></div><div id="marcadores"></div></div>
  <div class="sombra-sup"></div><div class="sombra-inf"></div>
  <div class="barra">
    <button class="sobres" id="sobres" aria-label="Invitaciones por responder"><svg width="42" height="31" viewBox="0 0 50 36"><rect x="1" y="1" width="48" height="34" rx="2" fill="#FBF7F0" stroke="#2B3350" stroke-width="1.2"/><path d="M1.5 2 L25 20 L48.5 2" fill="none" stroke="#2B3350" stroke-width="1.2"/><circle cx="25" cy="19" r="4" fill="#C0627A"/></svg><span id="respn">0/4</span></button>
    <div class="calendario"><div class="semana-txt">Semana 1</div><div class="dias" id="dias"></div></div>
    <button class="sello" id="comenzar" aria-label="Comenzar semana">▶</button>
  </div>
  <div class="nota" id="nota"><small>NOTA</small>Ya llegaron sus ocho jóvenes. Toque una carta para conocer a cada uno, o un sobre para responder.</div>
  <div class="mano" id="mano"></div>
  <div class="velo" id="velo"></div>
  <section class="hoja" id="hoja" aria-live="polite"></section>
</div>

<script>
const D = /*DATOS*/null;
const IMG = /*IMAGENES*/null;
const HAB=["baile","estatus","chisme","presencia","intelecto"], HABN={baile:"Baile",estatus:"Estatus",chisme:"Chisme",presencia:"Presencia",intelecto:"Intelecto"};
const ICON={recepcion:"🫖",paseo:"🌹",cena:"🍷",clase:"📖",baile:"🪭"};
const DSEM={24:"LUN",25:"MAR",26:"MIÉ",27:"JUE",28:"VIE",29:"SÁB",30:"DOM"};
const POS={palacio:[50,24],jardines:[74,41],imprenta:[26,38],academia:[62,57]};
const asign={}, respondidas=new Set();
let abierto=null;
const $=s=>document.querySelector(s);

function render(){
  const empieza=d=>D.eventos.some(e=>e.dia==d), sigue=d=>D.eventos.some(e=>d>e.dia&&d<e.dia+(e.duracion||1));
  $("#dias").innerHTML=[24,25,26,27,28,29,30].map(d=>`<div class="ficha-barra dia ${d==27?'hoy':''} ${empieza(d)?'evento':sigue(d)?'sigue':'libre'}" title="${empieza(d)?'Empieza un evento':sigue(d)?'Continúa un evento':'Sin eventos'}"><small>${DSEM[d]}</small>${d}</div>`).join("");
  $("#marcadores").innerHTML=D.eventos.map(e=>{const [x,y]=POS[e.lugar];return `<button class="marcador ${e.obligatorio?'oblig':''} ${respondidas.has(e.id)?'resp-ok':''} ${abierto&&abierto.e&&abierto.e.id==e.id?'activo':''}" style="left:${x}%;top:${y}%" data-ev="${e.id}" aria-label="${e.titulo}"><span class="icono">${ICON[e.tipo]||"✉"}</span><span class="etq"><b>${e.dia}</b><span>${e.lugarN}</span></span></button>`}).join("");
  document.querySelectorAll(".marcador").forEach(b=>b.onclick=()=>abrirEvento(b.dataset.ev));
  const ocup=ocupados();
  const scr=$("#mano").scrollLeft;const ev=abierto&&abierto.tipo=="evento";
  $("#mano").innerHTML=D.elenco.map(p=>`<button class="cuadro ${ev&&abierto.plazas.includes(p.id)?'elegido':''} ${ev&&!abierto.plazas.includes(p.id)&&motivo(p.id)?'noapto':''} ${!ev&&ocup[p.id]?'ocupado':''}" data-p="${p.id}" aria-label="${p.pila}"><div class="marco"><div class="lienzo"><img alt="" src="${IMG[p.id]}"><div class="placa">${p.pila}</div></div></div></button>`).join("");
  $("#mano").scrollLeft=scr;
  document.querySelectorAll(".cuadro").forEach(b=>b.onclick=()=>tocarCarta(b.dataset.p,b));
  $("#respn").textContent=`${respondidas.size}/${D.eventos.length}`;
  $("#sobres").classList.toggle("completo",respondidas.size==D.eventos.length);
  const obl=D.eventos.filter(e=>e.obligatorio).every(e=>respondidas.has(e.id));
  $("#comenzar").classList.toggle("listo",obl);
}
function ocupados(){const o={};for(const [ev,l] of Object.entries(asign))for(const p of l)(o[p]=o[p]||[]).push(ev);return o}
function medirMano(){const m=$("#mano");const h=$("#tel").getBoundingClientRect().bottom-m.getBoundingClientRect().top;$("#hoja").style.setProperty("--mano",h+"px");return h}
function enfocar(lugar){const tel=$("#tel").getBoundingClientRect();if(!lugar){$("#mundo").style.transform="";return}
  const y=POS[lugar][1]/100*tel.height;const dy=Math.max(-tel.height*.42,Math.min(0,150-y));$("#mundo").style.transform=`translateY(${dy}px)`}
function abrirHoja(expandida){medirMano();const h=$("#hoja");h.classList.toggle("expandida",!!expandida);requestAnimationFrame(()=>h.classList.add("on"));$("#velo").classList.add("on")}
function cerrar(){const h=$("#hoja");h.classList.remove("on","expandida");$("#velo").classList.remove("on");enfocar(null);abierto=null;render()}
// arrastre del asa: arriba expande, abajo compacta o cierra; un toque alterna
(function(){let y0=null,dy=0;const h=$("#hoja");
  h.addEventListener("pointerdown",e=>{if(!e.target.closest(".asa"))return;y0=e.clientY;dy=0;h.style.transition="none";h.setPointerCapture(e.pointerId)});
  h.addEventListener("pointermove",e=>{if(y0==null)return;dy=e.clientY-y0;if(dy>0)h.style.transform=`translateY(${dy}px)`});
  h.addEventListener("pointerup",()=>{if(y0==null)return;h.style.transition="";h.style.transform="";
    if(Math.abs(dy)<6)h.classList.toggle("expandida");else if(dy<-30)h.classList.add("expandida");else if(dy>60){if(h.classList.contains("expandida"))h.classList.remove("expandida");else cerrar()}
    y0=null})})();
$("#velo").onclick=cerrar;

function grupo(ids,h){const v=ids.map(i=>D.pers[i].habilidades[h]).sort((a,b)=>b-a);if(!v.length)return 0;return Math.min(5,v[0]+(v.slice(1).some(x=>x>=3)?1:0))}
function radar(req,ids,size){const c=size/2,r=c-34,ang=i=>-Math.PI/2+i*2*Math.PI/5;
  const pt=(i,v)=>[c+Math.cos(ang(i))*r*v/5,c+Math.sin(ang(i))*r*v/5];
  const poly=vals=>vals.map((v,i)=>pt(i,v).join(",")).join(" ");
  let s=`<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Pentágono de habilidades">`;
  for(const k of [1,2,3,4,5])s+=`<polygon points="${poly([k,k,k,k,k])}" fill="none" stroke="#EFE7DA" stroke-width="1"/>`;
  if(req)s+=`<polygon points="${poly(HAB.map(h=>req[h]||0))}" fill="none" stroke="#5D6480" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  if(ids&&ids.length)s+=`<polygon points="${poly(HAB.map(h=>grupo(ids,h)))}" fill="rgba(192,98,122,.25)" stroke="#C0627A" stroke-width="2"/>`;
  HAB.forEach((h,i)=>{const [x,y]=pt(i,6.3);s+=`<text x="${x}" y="${y+3}" font-size="9" text-anchor="middle" fill="#5D6480" font-family="Cormorant Garamond, serif" font-weight="600">${HABN[h].toUpperCase()}</text>`});
  return s+"</svg>"}

function ocultarNota(){$("#nota").hidden=true}
function motivo(pid){const {e,plazas}=abierto;const p=D.pers[pid];const otros=(ocupados()[pid]||[]).filter(x=>x!=e.id);
  if(otros.some(x=>D.eventos.find(y=>y.id==x).dia==e.dia))return `${p.pila} ya tiene compromiso el ${e.dia}.`;
  if(otros.length>=2)return `${p.pila} ya tiene dos compromisos esta semana.`;
  if(plazas.length>=e.plazas.max)return "No quedan huecos. Retire a alguien primero.";
  if(e.regla=="dama_caballero"&&plazas.map(x=>D.pers[x].genero).includes(p.genero))return p.genero=="m"?"Falta una dama, no otro caballero.":"Falta un caballero, no otra dama.";
  return ""}
function abrirEvento(id){ocultarNota();const e=D.eventos.find(x=>x.id==id);abierto={tipo:"evento",e,plazas:[...(asign[id]||[])]};
  pintarEvento();enfocar(e.lugar);abrirHoja(false);render()}
function pintarEvento(){const {e,plazas}=abierto;const n=e.plazas.max;const h=$("#hoja");
  let pl="";for(let i=0;i<n;i++){const p=plazas[i];pl+=p?`<div class="plaza llena" data-i="${i}" title="Toque para retirar"><img alt="${D.pers[p].pila}" src="${IMG[p]}"></div>`:`<div class="plaza" data-i="${i}"><b>+</b>${i<e.plazas.min?"Toque una carta":"Opcional"}</div>`}
  const listo=plazas.length>=e.plazas.min, exp=h.classList.contains("expandida");
  h.innerHTML=`<button class="asa" aria-label="Arrastre para ver más o cerrar"></button><button class="cerrar" aria-label="Cerrar">✕</button>
   <div class="cab"><div class="fecha-g"><small>${e.obligatorio?"OBLIG.":DSEM[e.dia]}</small>${e.dia}</div><div><h2>${e.titulo}</h2><div class="sub">${e.anfitrion} · ${e.reglaN}</div></div></div>
   <p class="cita" style="margin:8px 0 6px">${e.resumen}</p>
   <div class="fila" style="justify-content:space-between"><div class="plazas">${pl}</div>${e.requisito?radar(e.requisito,plazas,150):""}</div>
   <ul class="lista" style="margin-top:6px">${e.a_favor.map(x=>`<li>+ ${x}</li>`).join("")}${e.en_contra.map(x=>`<li>− ${x}</li>`).join("")}</ul>
   <div class="aviso" id="aviso">${plazas.length?"":"Toque las cartas de abajo para invitar."}</div>
   <div class="pie" style="margin-top:2px"><button class="mas" id="mas"><span class="t1">✉ Leer la invitación</span><span class="t2">✉ Cerrar la invitación</span></button><button class="sello-g ${listo?'listo':''}" id="responder">Sellar</button></div>
   <div class="carta-completa"><div class="etiqueta">La invitación</div><p class="sub">${e.carta.saludo}</p><p class="bio" style="white-space:pre-line">${e.carta.cuerpo}</p><p style="font-family:var(--display);font-style:italic;font-size:20px;text-align:right;margin:4px 0 0">${e.carta.firma}</p></div>`;
  h.classList.toggle("expandida",exp);
  $(".cerrar").onclick=cerrar;$("#mas").onclick=()=>h.classList.toggle("expandida");
  document.querySelectorAll(".plaza.llena").forEach(el=>el.onclick=()=>{abierto.plazas.splice(+el.dataset.i,1);pintarEvento();render()});
  $("#responder").onclick=()=>{if(!listo){$("#aviso").textContent=`Faltan ${e.plazas.min-plazas.length} por elegir.`;return}asign[e.id]=[...abierto.plazas];respondidas.add(e.id);cerrar()};
}
function volar(pid,btn){const tel=$("#tel").getBoundingClientRect();const desde=btn.querySelector("img").getBoundingClientRect();
  const i=abierto.plazas.indexOf(pid);const destino=document.querySelector(`.plaza[data-i="${i}"]`);if(!destino)return;const hasta=destino.getBoundingClientRect();
  const im=document.createElement("img");im.src=IMG[pid];im.className="volando";Object.assign(im.style,{left:desde.left-tel.left+"px",top:desde.top-tel.top+"px",width:desde.width+"px",height:desde.height+"px"});
  $("#tel").appendChild(im);destino.style.visibility="hidden";
  const a=im.animate([{transform:"translate(0,0)"},{transform:`translate(${hasta.left-desde.left}px,${hasta.top-desde.top}px) scale(${hasta.width/desde.width})`}],{duration:matchMedia("(prefers-reduced-motion:reduce)").matches?1:380,easing:"cubic-bezier(.2,.8,.2,1)"});
  im.style.transformOrigin="top left";a.onfinish=()=>{im.remove();destino.style.visibility=""}}
function tocarCarta(pid,btn){
  if(abierto&&abierto.tipo=="evento"){const {plazas}=abierto;
    if(plazas.includes(pid)){plazas.splice(plazas.indexOf(pid),1);pintarEvento();render();return}
    const m=motivo(pid);if(m){$("#aviso").textContent=m;btn.classList.add("sacude");setTimeout(()=>btn.classList.remove("sacude"),400);return}
    plazas.push(pid);pintarEvento();render();volar(pid,document.querySelector(`.cuadro[data-p="${pid}"]`));return}
  abrirFicha(pid)}
function abrirFicha(pid){ocultarNota();const p=D.pers[pid];abierto={tipo:"ficha"};
  $("#hoja").innerHTML=`<button class="cerrar" aria-label="Cerrar">✕</button>
   <div class="ficha-cab"><div class="cuadro"><div class="marco"><div class="lienzo"><img alt="" src="${IMG[pid]}"></div></div></div><div><h2>${p.nombre}</h2><div class="sub">${p.casa}</div><p class="cita">${p.linea}</p></div></div>
   <div class="fila" style="margin-top:8px">${radar(null,[pid],150)}<dl class="tecnica"><dt>Edad</dt><dd>${p.edad}</dd>${HAB.map(h=>`<dt>${HABN[h]}</dt><dd>${p.habilidades[h]} de 5</dd>`).join("")}</dl></div>
   <div class="etiqueta">Biografía</div><p class="bio">${p.bio}</p>
   <div class="etiqueta">Lo que usted sabe</div>
   ${p.entradas.map((t,i)=>`<div class="entrada ${i?'bloq':''}">${i?'Aún no lo sabe.':t}</div>`).join("")}`;
  $("#hoja").insertAdjacentHTML("afterbegin",'<button class="asa" aria-label="Arrastre para cerrar"></button>');
  $(".cerrar").onclick=cerrar;abrirHoja(true);render()}
$("#sobres").onclick=()=>{const e=D.eventos.find(x=>!respondidas.has(x.id));if(e)abrirEvento(e.id)};
$("#comenzar").onclick=()=>{if($("#comenzar").classList.contains("listo")){$("#nota").hidden=false;$("#nota").innerHTML="<small>NOTA</small>Aquí empezaría la semana: los días corren y los retratos viajan por el mapa.";}};
render();
</script>
